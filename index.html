<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>멀티플레이어 보스 레이드</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .boss-card, .player-card { background: #2a2a2a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .hp-bar-bg { background: #444; height: 24px; border-radius: 12px; overflow: hidden; margin: 10px 0; }
        .hp-bar-fill { background: #e74c3c; height: 100%; width: 100%; transition: width 0.2s; }
        .btn { background: #e67e22; border: none; padding: 12px 24px; color: #fff; font-size: 18px; border-radius: 8px; cursor: pointer; }
        .btn:hover { background: #d35400; }
        .inventory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 15px; }
        .slot { background: #333; border: 2px solid #555; height: 70px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }
        .slot.equipped { border-color: #f1c40f; background: #3d3511; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #2c3e50; padding: 30px; border-radius: 12px; width: 350px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 보스 카드 -->
        <div class="boss-card">
            <h1 id="bossName">🐷 꿀신</h1>
            <div class="hp-bar-bg"><div id="bossHpFill" class="hp-bar-fill"></div></div>
            <p id="bossHpText">12000 / 12000</p>
            <button class="btn" onclick="attack()">⚔️ 공격하기</button>
        </div>

        <!-- 플레이어 상태 및 쿠폰 -->
        <div class="player-card">
            <h2>내 정보</h2>
            <p>HP: ❤️<span id="myHp">100</span>/100 | 골드: 💰<span id="myGold">0</span> G</p>
            <div>
                <input type="text" id="couponInput" placeholder="쿠폰 코드 입력">
                <button onclick="useCoupon()">입력</button>
            </div>
        </div>

        <!-- 36칸 무기고 -->
        <div class="player-card">
            <h3>📦 무기고 (36칸)</h3>
            <div class="inventory-grid" id="inventoryGrid"></div>
        </div>
    </div>

    <!-- 가득 참 팝업 -->
    <div id="fullModal" class="modal">
        <div class="modal-content">
            <h3>⚠️ 무기고가 가득 찼습니다!</h3>
            <p id="dropItemText"></p>
            <button class="btn" onclick="closeModal()">🗑️ 버리기</button>
            <button class="btn" style="background:#27ae60;" onclick="closeModal()">💰 무기고 정리하기</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myId = null;

        socket.on('connect', () => { myId = socket.id; });

        socket.on('updateState', (state) => {
            document.getElementById('bossName').innerText = state.boss.name;
            const bossHpPct = (state.boss.currentHp / state.boss.maxHp) * 100;
            document.getElementById('bossHpFill').style.width = `${Math.max(0, bossHpPct)}%`;
            document.getElementById('bossHpText').innerText = `${Math.max(0, state.boss.currentHp)} / ${state.boss.maxHp}`;

            const me = state.players[myId];
            if (me) {
                document.getElementById('myHp').innerText = me.hp;
                document.getElementById('myGold').innerText = me.gold;

                const grid = document.getElementById('inventoryGrid');
                grid.innerHTML = '';
                for (let i = 0; i < 36; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    const item = me.inventory[i];
                    if (item) {
                        if (me.equippedIndex === i) slot.classList.add('equipped');
                        slot.innerHTML = `<div>${item.icon} +${item.enhance||0}</div><div>${item.name}</div>`;
                        slot.onclick = () => showItemMenu(i, item);
                    } else {
                        slot.innerText = '빈 슬롯';
                    }
                    grid.appendChild(slot);
                }
            }
        });

        function attack() { socket.emit('attack'); }
        function useCoupon() {
            const code = document.getElementById('couponInput').value.trim();
            if (code) socket.emit('useCoupon', code);
        }

        socket.on('couponResult', (res) => alert(res.message));

        socket.on('itemObtained', (data) => {
            if (data.full) {
                document.getElementById('dropItemText').innerText = `획득 무기: ${data.weapon.icon} ${data.weapon.name}`;
                document.getElementById('fullModal').style.display = 'flex';
            } else {
                alert(`🎉 [${data.weapon.rarity}] ${data.weapon.name} 획득!`);
            }
        });

        function closeModal() { document.getElementById('fullModal').style.display = 'none'; }

        function showItemMenu(index, item) {
            const act = prompt(`[${item.name} +${item.enhance||0}]\n1: 장착/해제 | 2: 강화 (${(item.enhance+1)*500}G) | 3: 판매 (${item.sellPrice}G)`);
            if (act === '1') socket.emit('equipItem', index);
            if (act === '2') socket.emit('enhanceItem', index);
            if (act === '3') socket.emit('sellItem', index);
        }
    </script>
</body>
</html>
