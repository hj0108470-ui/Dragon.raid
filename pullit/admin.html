<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>👑 GM 관제 센터</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f0c1b; color: #00ffcc; padding: 20px; margin: 0; }
        h1 { text-align: center; text-shadow: 0 0 10px #00ffcc; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background: rgba(255, 255, 255, 0.05); border: 2px solid #00ffcc; border-radius: 16px; padding: 20px; }
        .btn-gm { background: linear-gradient(135deg, #8e44ad, #2980b9); border: none; color: #fff; padding: 10px 15px; margin: 5px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: linear-gradient(135deg, #c0392b, #e74c3c); }
        .btn-gold { background: linear-gradient(135deg, #f39c12, #f1c40f); color: #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid rgba(0,255,204,0.3); padding: 10px; text-align: center; }
    </style>
</head>
<body>
    <h1>👑 GM 신의 전지전능 관제 센터 👑</h1>
    <div class="dashboard-grid">
        <div class="panel">
            <h3>🐉 보스 직접 조작</h3>
            <p>상태: <strong id="bossStatus">-</strong></p>
            <button class="btn-gm" onclick="spawnBoss('pig')">🐷 꿀신 소환</button>
            <button class="btn-gm" onclick="spawnBoss('goliath')">🗿 골리앗 소환</button>
            <button class="btn-gm" onclick="spawnBoss('iraso')">🦖 이라소 소환</button>
            <button class="btn-gm" onclick="spawnBoss('dragon')">🐉 드래곤 소환</button>
            <br><br>
            <button class="btn-gm btn-danger" onclick="killBoss()">💥 보스 즉시 처치</button>
        </div>

        <div class="panel">
            <h3>👥 접속 유저 실시간 통제</h3>
            <table>
                <thead>
                    <tr>
                        <th>소켓 ID</th>
                        <th>이름</th>
                        <th>HP</th>
                        <th>골드</th>
                        <th>인벤</th>
                        <th>GM 개입</th>
                    </tr>
                </thead>
                <tbody id="playerTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();

        socket.on('updateState', (state) => {
            document.getElementById('bossStatus').innerText = `${state.boss.name} [HP: ${state.boss.currentHp} / ${state.boss.maxHp}]`;
            const tbody = document.getElementById('playerTable');
            tbody.innerHTML = '';

            Object.values(state.players).forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.id.substring(0, 6)}</td>
                    <td><b>${p.name}</b></td>
                    <td>❤️ ${p.hp}/${p.maxHp}</td>
                    <td>💰 ${p.gold.toLocaleString()} G</td>
                    <td>📦 ${p.inventory.length}/36</td>
                    <td>
                        <button class="btn-gm btn-gold" onclick="giveGold('${p.id}')">💰 +10k G</button>
                        <button class="btn-gm" onclick="giveMythic('${p.id}')">🎁 신화무기</button>
                        <button class="btn-gm btn-danger" onclick="punish('${p.id}')">⚡ HP 1 벼락</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        function spawnBoss(type) { socket.emit('adminAction', { action: 'spawnBoss', payload: type }); }
        function killBoss() { socket.emit('adminAction', { action: 'killBoss' }); }
        function giveGold(id) { socket.emit('adminAction', { action: 'giveGold', payload: { targetId: id, amount: 10000 } }); }
        function giveMythic(id) { socket.emit('adminAction', { action: 'giveMythic', payload: { targetId: id } }); }
        function punish(id) { socket.emit('adminAction', { action: 'punish', payload: { targetId: id } }); }
    </script>
</body>
</html>
